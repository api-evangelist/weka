aid: weka
name: Weka
description: >-
  WEKA (WekaIO, Inc.) builds NeuralMesh, a software-defined, high-performance
  data platform for AI, machine learning, and HPC workloads. Its container-native
  storage system delivers a unified namespace across NVMe SSD and object storage,
  running on bare metal and across AWS, Azure, GCP, and OCI. WEKA clusters expose
  a RESTful management API (served at /api/v2 on port 14000) that automates
  filesystems, quotas, snapshots, S3 buckets, multi-tenancy, users, KMS, alerts,
  and events, with a first-party CLI, Kubernetes CSI driver and operator, and
  Terraform modules. The company is backed by Norwest Venture Partners and others.
url: https://raw.githubusercontent.com/api-evangelist/weka/refs/heads/main/apis.yml
