openapi: 3.2.0
info:
  title: '@weka-api System IO API'
  version: '5.1'
  description: 'The WEKA system provides a RESTful API, enabling efficient

    automation and integration into existing workflows or monitoring systems.'
servers:
- url: /api/v2
security:
- bearerAuth: []
tags:
- name: System IO
paths:
  /io/start:
    post:
      tags:
      - System IO
      summary: Start cluster IO services
      description: Initiates IO services across the entire cluster.
      operationId: startIO
      responses:
        '200':
          description: Successful initiation of cluster IO services.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      resend_secs:
                        type: number
                        example: 3
                        description: Interval in seconds before resending the request, if required.
                      result:
                        type: object
                        properties:
                          status:
                            type: string
                            example: STARTING_NODES
                            description: Current status of the IO service startup process.
                      completed:
                        type: boolean
                        example: false
                        description: Indicates whether the IO services have been fully started.
        '401':
          $ref: '#/components/responses/401'
  /io/stop:
    post:
      tags:
      - System IO
      summary: Stop cluster IO services
      description: Shuts down IO services across the entire cluster.
      operationId: stopIO
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                brutal_no_flush:
                  type: boolean
                  description: Immediately stops IO services without performing a graceful flush of ongoing operations.<br> This option may lead to data loss and must only be used under explicit guidance from the Customer Success Team.
      responses:
        '200':
          description: Successful initiation of cluster IO shutdown.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      resend_secs:
                        type: number
                        example: 3
                        description: Interval in seconds before resending the request, if required.
                      result:
                        type: object
                        properties:
                          status:
                            type: string
                            example: STOPPING_SERVICES
                            description: Current status of the IO service shutdown process.
                      completed:
                        type: boolean
                        example: false
                        description: Indicates whether the IO services have been fully stopped.
        '401':
          $ref: '#/components/responses/401'
components:
  responses:
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            properties:
              data:
                type: string
                example: Unauthorized
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
