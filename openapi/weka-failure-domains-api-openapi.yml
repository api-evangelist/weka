openapi: 3.2.0
info:
  title: '@weka-api Failure domains API'
  version: '5.1'
  description: 'The WEKA system provides a RESTful API, enabling efficient

    automation and integration into existing workflows or monitoring systems.'
servers:
- url: /api/v2
security:
- bearerAuth: []
tags:
- name: Failure domains
paths:
  /failureDomains:
    get:
      tags:
      - Failure domains
      summary: List failure domains
      description: Lists all failure domains in the cluster. A failure domain is a set of hardware components that can fail together from a single root cause.
      operationId: getFailureDomains
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/failureDomain'
        '401':
          $ref: '#/components/responses/401'
      parameters:
      - in: query
        name: show_removed
        schema:
          type: boolean
  /failureDomains/{uid}:
    get:
      tags:
      - Failure domains
      summary: Get failure domain details
      description: Returns details for a specific failure domain, including its resources and capacity.
      operationId: getSingleFailureDomain
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/failureDomain'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      parameters:
      - in: path
        name: uid
        required: true
        schema:
          type: string
        description: The unique identifier of the failure domain.
components:
  responses:
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: error message
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            properties:
              data:
                type: string
                example: Unauthorized
  schemas:
    failureDomain:
      type: object
      properties:
        id:
          type: string
          example: DOM-001
        uid:
          type: string
          example: uid_string
        drives:
          type: array
          items:
            type: string
            example: DiskId<2>
        hosts:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
