openapi: 3.0.3
info:
  title: '@weka-api Active Directory Nodes API'
  version: '5.1'
  description: "\n<div>\n  The WEKA system provides a RESTful API, enabling efficient\n  automation and integration into existing workflows or monitoring systems. To access\n  the REST API documentation within the cluster, navigate to <code>/api/v2/docs</code>\n  on port 14000 (e.g.,\n  <code>https://weka01:14000/api/v2/docs</code>).\n  <br>\n  <br>\n  For detailed guidance on using the REST API, including CLI command equivalents and related concepts, refer to the official\n  documentation:\n  <a href=\"https://docs.weka.io/getting-started-with-weka/getting-started-with-weka-rest-api\">Getting Started with the WEKA REST API</a>.\n  <br>\n  <br>\n  <div style=\"margin-top: 15px;\">\n    <b>Important:</b>\n    WEKA uses 64-bit numbers, which requires careful handling when interacting with the API across different programming languages.\n    In JavaScript, for instance, the\n    <code>\"json-bigint\"</code>\n    library is recommended.\n  </div>\n</div>"
servers:
- url: /api/v2
security:
- bearerAuth: []
tags:
- name: Nodes
paths:
  /nodes:
    get:
      deprecated: true
      tags:
      - Nodes
      summary: Get all nodes - deprecated, use GET /processes
      operationId: getNodes
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/node'
        '401':
          $ref: '#/components/responses/401'
  /nodes/{uid}:
    get:
      deprecated: true
      tags:
      - Nodes
      summary: Get node - deprecated, use GET /processes/{uid}
      parameters:
      - in: path
        name: uid
        required: true
        schema:
          type: string
        description: Node uid.
      operationId: getNode
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/node'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
components:
  responses:
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: error message
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            properties:
              data:
                type: string
                example: Unauthorized
  schemas:
    node:
      type: object
      properties:
        id:
          type: string
          example: NodeId<61>
        dpdk_port_info:
          type: array
          items:
            type: string
            example: info
        network_mode:
          type: string
          example: DPDK
        mode:
          type: string
          example: backend
        container_name:
          type: string
          example: default
        lowest_node_path_issue:
          type: string
          example: NodeId<INVALID>
        last_fencing_reason:
          type: string
          example: INVALID
        uid:
          type: string
          example: 2689d12c-5b47-d867-6af4-928dfa152a45
        hostname:
          type: string
          example: ip-172-31-38-126.support.local
        ips:
          type: array
          items:
            type: string
            example: 172.31.41.173
        slot:
          type: number
          example: 1
        is_blacklisted:
          type: boolean
          example: false
        roles:
          type: array
          items:
            type: string
            example: FRONTEND
        missing_links:
          type: object
          properties:
            missing:
              type: number
              example: 0
            self_report:
              type: object
              properties:
                up:
                  type: object
                  properties:
                    missing:
                      type: number
                      example: 0
                    synced:
                      type: number
                      example: 23
                    required:
                      type: number
                      example: 23
                joining:
                  type: object
                  properties:
                    missing:
                      type: number
                      example: 0
                    synced:
                      type: number
                      example: 0
                    required:
                      type: number
                      example: 0
                syncing:
                  type: object
                  properties:
                    missing:
                      type: number
                      example: 0
                    synced:
                      type: number
                      example: 0
                    required:
                      type: number
                      example: 0
                total:
                  type: number
                  example: 23
            others_report:
              type: object
              properties:
                syncing_reporters:
                  type: array
                  items:
                    type: string
                    example: report
                up_reporters:
                  type: array
                  items:
                    type: string
                    example: report
                joining_missing:
                  type: number
                  example: 0
                up_missing:
                  type: number
                  example: 0
                syncing_missing:
                  type: number
                  example: 0
                missing:
                  type: number
                  example: 0
                joining_reporters:
                  type: array
                  items:
                    type: string
                    example: report
                reporters:
                  type: array
                  items:
                    type: string
                    example: report
        is_ucx:
          type: boolean
          example: false
        cpu_is_dedicated:
          type: boolean
          example: true
        sw_version:
          type: string
          example: 4.0.1.5908
        cpu_core_id:
          type: number
          example: 1
        host_id:
          type: string
          example: HostId<3>
        cpu_numa_node:
          type: number
          example: 0
        gds_mode:
          type: string
          example: mode
        cpu_socket_id:
          type: number
          example: 0
        rdma_mode:
          type: string
          example: mode
        memory:
          type: number
          example: 1476395008
        up_since:
          type: string
          example: '2022-07-27T07:51:54.782895Z'
        trace_history_in_seconds:
          type: number
          example: 6367
        leadership_role:
          type: string
          example: role
        mgmt_ips:
          type: array
          items:
            type: string
            example: 172.31.38.126
        last_fencing_time:
          type: string
          example: '2021-11-22T08:44:15.725096Z'
        status:
          type: string
          example: UP
        cpu_model:
          type: string
          example: Intel(R) Xeon(R) CPU E5-2686 v4 @ 2.30GHz
        dpdk_ip:
          type: string
          example: 172.31.41.173
        ucx_mode:
          type: string
          example: mode
        dpdk_socket_info:
          type: array
          items:
            type: string
            example: info
        mgmt_port:
          type: number
          example: 14000
        last_join_reject_reason:
          type: string
          example: NONE
        is_dpdk:
          type: boolean
          example: true
        cpu_id:
          type: number
          example: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
