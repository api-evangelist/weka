openapi: 3.2.0
info:
  title: '@weka-api Login API'
  version: '5.1'
  description: 'The WEKA system provides a RESTful API, enabling efficient

    automation and integration into existing workflows or monitoring systems.'
servers:
- url: /api/v2
security:
- bearerAuth: []
tags:
- name: Login
paths:
  /login:
    post:
      summary: Log in to the cluster
      description: 'Authenticates and grants access to the cluster using valid credentials.

        Securely saves user credentials in the user''s home directory upon successful login.'
      operationId: login
      tags:
      - Login
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/tokens'
        '401':
          $ref: '#/components/responses/401'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  description: User's username.
                  example: admin
                password:
                  type: string
                  description: User's password.
                  example: Password123
                org:
                  type: string
                  description: Organization name, default 'Root'.
                  example: root
  /login/refresh:
    post:
      summary: Get access token
      description: 'Obtains a new access token using an existing refresh token.

        The system creates an authentication token file and saves it in `~/.weka/auth-token.json`.

        The token file contains both the access token and the refresh token.'
      operationId: refreshToken
      tags:
      - Login
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/tokens'
        '401':
          $ref: '#/components/responses/401'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: Refresh token.
                  example: refresh_token_string
                access_token_expiry:
                  type: number
                  description: Access token expiration time.
                  example: 300
                refresh_token_expiry:
                  type: number
                  description: Refresh token expiration time.
                  example: 300
components:
  responses:
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            properties:
              data:
                type: string
                example: Unauthorized
  schemas:
    tokens:
      type: object
      properties:
        access_token:
          type: string
          example: access_token_string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: number
          example: 3000
        refresh_token:
          type: string
          example: refresh_token_string
        password_change_required:
          type: boolean
          example: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
