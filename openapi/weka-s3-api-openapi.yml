    put:
      tags:
      - S3
      summary: Refresh all LDAP S3 users
      description: Synchronizes UID, GID, and S3 policies for all LDAP-imported users to ensure cluster permissions match the current directory state. This operation updates existing identities and reports success or failure counts.
      operationId: refreshS3ImportedUsers
      security:
      - basicAuth: []
      responses:
        '200':
          description: Refresh completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: 'Refresh completed: 45 success, 2 failures'
                  success_count:
                    type: number
                    example: 45
                  failure_count:
                    type: number
                    example: 2
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                    - 'User user1: S3 policy not found'
                    - 'User user2: LDAP authentication failed'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
