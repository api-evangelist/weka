      description: Synchronizes UID, GID, and S3 policies for all LDAP-imported users in the specified tenant.
      operationId: refreshS3ImportedUsersForTenant
      security:
      - basicAuth: []
      parameters:
      - name: tenantId
        in: path
        required: true
        description: The tenant ID (organization ID)
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: Refresh completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  success_count:
                    type: number
                  failure_count:
                    type: number
                  errors:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
components:
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            properties:
              data:
                example: null
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: error message
              data:
                type: object
                properties:
                  missing_params:
                    type: array
                    items:
                      type: string
                      example: param1
                  param:
                    type: string
                    example: param2
                  error:
                    type: string
                    example: param2 has an error
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            properties:
              data:
                type: string
                example: Unauthorized
  schemas:
    s3Bucket:
      type: object
      properties:
        name:
          type: string
          example: bucket1
        hard_limit_bytes:
          type: number
          example: 10000003072
        path:
          type: string
          example: /path
        used_bytes:
          type: number
          example: 4096
        fs:
          type: string
          example: default
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
