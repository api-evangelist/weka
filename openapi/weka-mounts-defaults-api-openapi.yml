openapi: 3.2.0
info:
  title: '@weka-api Mounts Defaults API'
  version: '5.1'
  description: 'The WEKA system provides a RESTful API, enabling efficient

    automation and integration into existing workflows or monitoring systems.'
servers:
- url: /api/v2
security:
- bearerAuth: []
tags:
- name: Mounts Defaults
paths:
  /mountDefaults:
    get:
      tags:
      - Mounts Defaults
      summary: Get default mount options
      description: Returns the configured default mount options applied to all filesystems across the cluster.
      operationId: getMountDefaults
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/mountDefaults'
        '401':
          $ref: '#/components/responses/401'
    put:
      tags:
      - Mounts Defaults
      summary: Set default mount options
      description: Configures default mount options applied to all filesystems across the cluster.
      operationId: setMountDefaults
      responses:
        '200':
          $ref: '#/components/responses/200'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                qos_max_throughput_mbps:
                  type: number
                  example: 300000
                  description: Default QoS max throughput in Mbps.
                qos_preferred_throughput_mbps:
                  type: number
                  example: 200000
                  description: Default QoS preferred throughput in Mbps.
    delete:
      tags:
      - Mounts Defaults
      summary: Reset default mount options
      description: Reverts the default mount options to initial settings for all filesystems in the cluster.
      operationId: resetMountDefaults
      responses:
        '200':
          $ref: '#/components/responses/200'
        '401':
          $ref: '#/components/responses/401'
      parameters:
      - in: query
        name: qos_max_throughput_mbps
        schema:
          type: boolean
          example: false
          description: Reset QoS max throughput to default.
      - in: query
        name: qos_preferred_throughput_mbps
        schema:
          type: boolean
          example: false
          description: Reset QoS preferred throughput to default.
components:
  schemas:
    mountDefaults:
      type: object
      properties:
        qos_max_throughput:
          type: number
          example: '100240444'
        qos_preferred_throughput:
          type: number
          example: '100240444'
  responses:
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: error message
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            properties:
              data:
                type: string
                example: Unauthorized
    '200':
      description: Success
      content:
        application/json:
          schema:
            properties:
              data:
                example: null
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
